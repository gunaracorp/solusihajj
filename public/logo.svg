<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Logo SolusiHajj">
  <!-- ============================================================
       SolusiHajj — Mark "Gerbang Amanah" (v7 Final)
       Ubin zamrud • orbit gading (jalur jamaah) • Ka'bah + hizam emas
       • bintang Nur di celah orbit
       Brand system: hijau #0E6B4E, emas #C9A227, gading #FAF7F2
       ============================================================ -->
  <defs>
    <linearGradient id="shTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#118060"/>
      <stop offset="0.55" stop-color="#0E6B4E"/>
      <stop offset="1" stop-color="#0A4A36"/>
    </linearGradient>
    <linearGradient id="shHizam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBD083"/>
      <stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
    <linearGradient id="shStar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3E1A0"/>
      <stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
    <radialGradient id="shGlow" cx="0.34" cy="0.26" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ubin dasar -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#shTile)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#shGlow)"/>
  <rect x="46" y="46" width="420" height="420" rx="92" fill="none" stroke="#E9DFC8" stroke-opacity="0.14" stroke-width="2.5"/>

  <!-- Orbit gading — jalur jamaah menuju Baitullah (celah di kanan-atas) -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#F5F1E6" stroke-width="30"
          stroke-linecap="round" stroke-dasharray="845.6 210"/>

  <!-- Ka'bah -->
  <g>
    <rect x="172" y="184" width="168" height="168" rx="12" fill="#17181D"/>
    <!-- hizam emas -->
    <rect x="172" y="246" width="168" height="32" fill="url(#shHizam)"/>
    <rect x="172" y="280" width="168" height="3" fill="#8A6D14" opacity="0.5"/>
    <!-- highlight sisi atas -->
    <rect x="172" y="184" width="168" height="12" rx="6" fill="#FFFFFF" opacity="0.08"/>
    <!-- bayang sisi kiri -->
    <rect x="172" y="184" width="30" height="168" rx="12" fill="#000000" opacity="0.14"/>
  </g>

  <!-- Bintang Nur 8 titik di celah orbit -->
  <g transform="translate(392 154)" fill="url(#shStar)">
    <path d="M0 -30 Q6 -6 30 0 Q6 6 0 30 Q-6 6 -30 0 Q-6 -6 0 -30 Z"/>
    <path d="M0 -16.5 Q3.3 -3.3 16.5 0 Q3.3 3.3 0 16.5 Q-3.3 3.3 -16.5 0 Q-3.3 -3.3 0 -16.5 Z" transform="rotate(45)"/>
  </g>
</svg>
