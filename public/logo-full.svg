  <!-- Bintang pemisah dekoratif -->
  <g transform="translate(276 218) scale(0.5)" fill="#C9A227">
    <path d="M0 -14 Q2.8 -2.8 14 0 Q2.8 2.8 0 14 Q-2.8 2.8 -14 0 Q-2.8 -2.8 0 -14 Z"/>
