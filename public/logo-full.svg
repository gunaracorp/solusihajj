  </text>
  <!-- Bintang pemisah dekoratif -->
  <g transform="translate(276 218) scale(0.5)" fill="#C9A227">
    <path d="M0 -14 Q2.8 -2.8 14 0 Q2.8 2.8 0 14 Q-2.8 2.8 -14 0 Q-2.8 -2.8 0 -14 Z"/>
  </g>
  <text x="310" y="228" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="700" fill="#0E6B4E" letter-spacing="2.5">
    ESCROW SYARIAH 40/40/20 • VERIFIKASI 5 LAPIS • 3.966 PENYELENGGARA ASIA
  </text>
