<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 256" width="1080" height="256" role="img" aria-label="SolusiHajj — Marketplace Umrah dan Haji Terbesar di Asia">
  <!-- ============================================================
       SolusiHajj — Lockup horizontal "Gerbang Amanah" (v7 Final)
       Untuk README, Open Graph, dan materi brand. Latar transparan.
       ============================================================ -->
  <defs>
    <linearGradient id="shTileF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#118060"/>
      <stop offset="0.55" stop-color="#0E6B4E"/>
      <stop offset="1" stop-color="#0A4A36"/>
    </linearGradient>
    <linearGradient id="shHizamF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBD083"/>
      <stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
    <linearGradient id="shStarF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3E1A0"/>
      <stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
  </defs>

  <!-- Mark (224px) -->
  <g transform="translate(16 16) scale(0.4375)">
    <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#shTileF)"/>
    <circle cx="256" cy="256" r="170" fill="none" stroke="#F5F1E6" stroke-width="30"
